[project]
name = "stratum-x"
version = "0.1.0"
description = "Adaptive Forecasting Agent for Prediction Markets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.0.0",
    "prophet>=1.1.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"